<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSP Dungeon generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <fieldset class="dungeons-widget">
        <legend>BSP Dungeon generator</legend>
        <canvas id="dungeons-widget__canvas" width="640" height="480"></canvas>

        <fieldset class="dungeons-widget__controls">
            <legend>Controls</legend>
            <div>
                <strong>Draw Options:</strong>
                <div>
                    <input type="checkbox" id="dungeons-widget__rooms" checked="true">
                    <label>Rooms</label>
                </div>
                <div>
                    <input type="checkbox" id="dungeons-widget__corridors" checked="true">
                    <label>Corridors</label>
                </div>
                <div>
                    <input type="checkbox" id="dungeons-widget__sector-map">
                    <label>Sector Map</label>
                </div>
                <div>
                    <strong>Instructions:</strong>
                    <p></p>
                </div>
                
            </div>
            <div>
                <strong>BSP Tree Config:</strong>
                <div class="dungeons-widget__control-box">
                    <label>Depth: <span id="dungeons-widget__depth-value"></span></label>
                    <input type="range" min="1" max="10" value="4" id="dungeons-widget__depth">
                </div>
                <div class="dungeons-widget__control-box">
                    <label>W/H Threshold Ratio: <span id="dungeons-widget__whthreshold-value"></span></label></label>
                    <input type="range" min="0.5" max="3" value="1.25" step="0.05" id="dungeons-widget__whthreshold">
                </div>
                <div class="dungeons-widget__control-box">
                    <label>Split Within Percentage: <span id="dungeons-widget__splitwithinpercentage-value"></span></label></label>
                    <input type="range" min="0.0" max="1.0" value="0.4" step="0.01" id="dungeons-widget__splitwithinpercentage">
                </div>

                <strong>Dungeon Config:</strong>
                <div class="dungeons-widget__control-box">
                    <label>Room Fill Percentage Min: <span id="dungeons-widget__roomfillpercentagemin-value"></span></label></label>
                    <input type="range" min="0.0" max="1" value="0.6" step="0.01" id="dungeons-widget__roomfillpercentagemin">
                </div>
                <div class="dungeons-widget__control-box">
                    <label>Room Fill Percentage Max: <span id="dungeons-widget__roomfillpercentagemax-value"></span></label></label>
                    <input type="range" min="0.0" max="1" value="0.8" step="0.01" id="dungeons-widget__roomfillpercentagemax">
                </div>
                <div class="dungeons-widget__control-box">
                    <label>Corridor Width: <span id="dungeons-widget__corridorwidth-value"></span></label></label>
                    <input type="range" min="1" max="50" value="10" step="1" id="dungeons-widget__corridorwidth">
                </div>
                <div class="dungeons-widget__control-box">
                    <div>
                        <label>Seed:</label>
                        <input type="text" id="dungeons-widget__seed">
                    </div>
                </div>

                <div class="dungeons-widget__control-box">
                    <div>
                        <button id="dungeons-widget__generate">Generate</button>
                        <button id="dungeons-widget__generaterandom">Generate Random</button>
                    </div>
                </div>

                <div class="dungeons-widget__control-box">
                </div>

                <div class="dungeons-widget__control-box">
                    <button id="dungeons-widget__log">Console Log Config</button>
                </div>
            </div>
        </fieldset>

    </fieldset>
        
    <script src="./script.js"></script>
</body>
</html>
