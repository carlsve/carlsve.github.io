<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Hero Idle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="widget__restaurant">
        <fieldset>
            <legend>Kitchen</legend>
            <fieldset>
                <legend>Money: <span id="widget__restaurant__money">100</span>$</legend>
            </fieldset>
            <div>
                <fieldset>
                    <legend>Ingredients: <span id="widget__restaurant__ingredients">0</span></legend>
                    <button id="widget__restaurant__buyingredient">Buy Ingredients</button>
                    <p>Cost: <span id="widget__restaurant__ingredientcost">10</span>$</p>
                </fieldset>
                <fieldset>
                    <legend>Cooks: <span id="widget__restaurant__cooks">1</span></legend>
                    <button id="widget__restaurant__hirecook">Hire Cook</button>
                    <p>Cost: <span id="widget__restaurant__cookcost">100</span>$</p>
                    <ul>
                        <li>
                            <button id="widget__restaurant__startcook">Cook</button>
                            <progress id="widget__restaurant__cookprogress" value="0" max="100"></progress>
                        </li>
                    </ul>
                </fieldset>
            </div>
        </fieldset>
        <fieldset>
            <legend>Dining Area</legend>
            <div>
                <p>Food: <span id="widget__restaurant__food">0</span></p>
                <p>Customers: <span id="widget__restaurant__customers">0</span></p>
                <button>Hire Server</button>
                <p>Cost: <span id="widget__restaurant__servercost">100</span>$</p>
                <ul>
                    <li>
                        <button id="widget__restaurant__serve">Serve</button>
                        <progress id="widget__restaurant__serveprogress" value="0" max="100"></progress>
                    </li>
                </ul>
            </div>
        </fieldset>
        <fieldset>
            <legend>Upgrades</legend>
        </fieldset>
    </div>
    <script src="widgets/restaurant.js"></script>
</body>
</html>
